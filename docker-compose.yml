services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: flatradar
      POSTGRES_USER: app
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-app}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U app -d flatradar"]
      interval: 5s
      timeout: 3s
      retries: 10

  backend-api:
    build:
      context: .
      dockerfile: backend-api/Dockerfile
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      JDBC_URL: jdbc:postgresql://postgres:5432/flatradar
      JDBC_USER: app
      JDBC_PASSWORD: ${POSTGRES_PASSWORD:-app}
      PORT: "8080"
      DISCORD_WEBHOOK_URL: ${DISCORD_WEBHOOK_URL:-}
    ports:
      - "8080:8080"
    healthcheck:
      test: ["CMD", "curl", "-fs", "http://localhost:8080/api/v1/health"]
      interval: 10s
      timeout: 3s
      retries: 5

  dashboard:
    build:
      context: .
      dockerfile: dashboard/Dockerfile
    depends_on:
      backend-api:
        condition: service_healthy
    environment:
      BACKEND_URL: http://backend-api:8080
      # Docker auto-sets HOSTNAME to the container's short ID, and Next.js's
      # standalone server binds to that literal value if set - which
      # resolves (via /etc/hosts) to the container's bridge IP, not a
      # loopback-reachable address. Override it so the server binds all
      # interfaces, otherwise `wget http://localhost:3000` (used by the
      # healthcheck below) gets connection refused.
      HOSTNAME: "0.0.0.0"
    ports:
      - "127.0.0.1:3000:3000"
    healthcheck:
      # 127.0.0.1, not localhost: /etc/hosts resolves localhost to both
      # 127.0.0.1 and ::1, busybox wget tries the IPv6 one first, and the
      # server (HOSTNAME=0.0.0.0 above) only binds IPv4 - so "localhost"
      # gets connection-refused on ::1 with no v4 fallback.
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:3000"]
      interval: 10s
      timeout: 3s
      retries: 5

  scraper:
    build:
      context: .
      dockerfile: Dockerfile
    depends_on:
      backend-api:
        condition: service_healthy
    environment:
      BACKEND_URL: http://backend-api:8080
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
    volumes:
      - ./feeds.json:/app/feeds.json:ro
    restart: "no"

volumes:
  postgres-data: