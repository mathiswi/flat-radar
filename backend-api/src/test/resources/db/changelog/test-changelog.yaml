databaseChangeLog:
  - changeSet:
      id: V1__init
      author: mathiswi
      changes:
        - createTable:
            tableName: listings
            columns:
              # Same shape as db/changelog/V1__init.yaml, except `id` is VARCHAR
              # instead of TEXT: Liquibase's generic TEXT type resolves to CLOB on
              # H2, and H2 cannot index/primary-key a CLOB column. Postgres has no
              # such restriction, which is why production keeps TEXT.
              - column:
                  name: id
                  type: VARCHAR(512)
                  constraints:
                    primaryKey: true
                    nullable: false
              - column:
                  name: title
                  type: TEXT
                  constraints:
                    nullable: false
              - column:
                  name: size
                  type: DOUBLE PRECISION
              - column:
                  name: rooms
                  type: DOUBLE PRECISION
              - column:
                  name: bedrooms
                  type: INTEGER
              - column:
                  name: bathrooms
                  type: INTEGER
              - column:
                  name: floor
                  type: TEXT
              - column:
                  name: apartment_type
                  type: TEXT
              - column:
                  name: available_from
                  type: DATE
              - column:
                  name: deposit
                  type: INTEGER
              - column:
                  name: base_rent
                  type: INTEGER
              - column:
                  name: side_costs
                  type: INTEGER
              - column:
                  name: heating_costs
                  type: INTEGER
              - column:
                  name: total_rent
                  type: INTEGER
              - column:
                  name: location
                  type: TEXT
                  constraints:
                    nullable: false
              - column:
                  name: url
                  type: TEXT
                  constraints:
                    nullable: false
              - column:
                  name: source
                  type: TEXT
                  constraints:
                    nullable: false
              - column:
                  name: district
                  type: TEXT
              - column:
                  name: first_seen
                  type: TIMESTAMPTZ
                  defaultValueComputed: now()
                  constraints:
                    nullable: false
              - column:
                  name: last_seen
                  type: TIMESTAMPTZ
                  defaultValueComputed: now()
                  constraints:
                    nullable: false
